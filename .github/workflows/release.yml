name: Release Maju

on:
  push:
    tags:
      - "v[0-9]*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: 24.14.1
  PNPM_VERSION: 11.4.0
  RUST_VERSION: 1.95.0
  FLUTTER_VERSION: 3.41.7

jobs:
  validate:
    name: Validate release tag
    if: github.repository == 'heap-cider/maju'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.source.outputs.source_sha }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and source versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          scripts/verify-release-ref.sh v "$VERSION"
          node -e 'const p=require("./desktop/package.json"); if(p.version!==process.argv[1]) process.exit(1)' "$VERSION"
          node -e 'const p=require("./desktop/src-tauri/tauri.conf.json"); if(p.version!==process.argv[1]) process.exit(1)' "$VERSION"
          grep -q "^version = \"$VERSION\"$" desktop/src-tauri/Cargo.toml
          grep -q "^version = \"$VERSION\"$" crates/maju-relay/Cargo.toml
          grep -q "^version: $VERSION+1$" mobile/pubspec.yaml
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Record immutable source
        id: source
        shell: bash
        run: echo "source_sha=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows installer
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 75
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      TARGET: x86_64-pc-windows-msvc
      MAJU_UPDATER_PUBLIC_KEY: ${{ secrets.MAJU_UPDATER_PUBLIC_KEY }}
      MAJU_UPDATER_ENDPOINT: https://github.com/heap-cider/maju/releases/download/maju-desktop-latest/latest.json
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Check updater secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$MAJU_UPDATER_PUBLIC_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"

      - name: Generate updater config
        shell: bash
        run: cd desktop && node scripts/build-release-config.mjs

      - name: Build desktop sidecars
        shell: bash
        run: |
          cargo build --release --locked --target "$TARGET" \
            -p maju-acp -p maju-agent -p maju-dev-mcp \
            -p git-credential-nostr -p maju-cli
          ./scripts/bundle-sidecars.sh "$TARGET"

      - name: Build unsigned Windows installer and signed updater artifact
        shell: bash
        env:
          CMAKE_POLICY_VERSION_MINIMUM: "3.5"
        run: |
          cd desktop
          pnpm tauri build --verbose --target "$TARGET" --bundles nsis \
            --config src-tauri/tauri.release.conf.json

      - name: Collect Windows assets
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="desktop/src-tauri/target/${TARGET}/release/bundle/nsis"
          INSTALLER=$(find "$BUNDLE_DIR" -maxdepth 1 -name '*.exe' -type f | head -1)
          test -n "$INSTALLER"
          test -f "${INSTALLER}.sig"
          cp "$INSTALLER" "Maju-${VERSION}-windows-x86_64-setup.exe"
          cp "${INSTALLER}.sig" "Maju-${VERSION}-windows-x86_64-setup.exe.sig"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-release
          path: |
            Maju-${{ env.VERSION }}-windows-x86_64-setup.exe
            Maju-${{ env.VERSION }}-windows-x86_64-setup.exe.sig
          if-no-files-found: error
          retention-days: 7

  relay:
    name: Linux relay
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Build relay and web clients
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -C web build
          pnpm -C admin-web build
          cargo build --release --locked -p maju-relay --bin maju-relay

      - name: Package relay
        shell: bash
        run: |
          set -euo pipefail
          ROOT="maju-relay-${VERSION}-linux-x86_64"
          mkdir -p "$ROOT/bin" "$ROOT/web" "$ROOT/admin-web"
          install -m 0755 target/release/maju-relay "$ROOT/bin/maju-relay"
          cp -R web/dist/. "$ROOT/web/"
          cp -R admin-web/dist/. "$ROOT/admin-web/"
          cp .env.example "$ROOT/.env.example"
          cat > "$ROOT/README.txt" <<'EOF'
          Maju relay package

          1. Configure PostgreSQL and Redis using .env.example.
          2. Set MAJU_WEB_DIR to the absolute path of this package's web folder.
          3. Set MAJU_ADMIN_WEB_DIR to the admin-web folder when the admin UI is enabled.
          4. Run bin/maju-relay.
          EOF
          tar -czf "${ROOT}.tar.gz" "$ROOT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: relay-release
          path: maju-relay-${{ env.VERSION }}-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      MAJU_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MAJU_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
      MAJU_ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.MAJU_ANDROID_UPLOAD_KEY_ALIAS }}
      MAJU_ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.MAJU_ANDROID_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.MAJU_ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$MAJU_ANDROID_UPLOAD_KEYSTORE_PASSWORD"
          test -n "$MAJU_ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$MAJU_ANDROID_UPLOAD_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/maju-upload.jks"
          echo "MAJU_ANDROID_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/maju-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --build-name "$VERSION" --build-number 1

      - name: Collect APK
        shell: bash
        run: cp mobile/build/app/outputs/flutter-apk/app-release.apk "Maju-${VERSION}-android.apk"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-release
          path: Maju-${{ env.VERSION }}-android.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [validate, windows, relay, android]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true

      - name: Verify and checksum assets
        shell: bash
        run: |
          set -euo pipefail
          test -f "release-assets/Maju-${VERSION}-windows-x86_64-setup.exe"
          test -f "release-assets/Maju-${VERSION}-windows-x86_64-setup.exe.sig"
          test -f "release-assets/maju-relay-${VERSION}-linux-x86_64.tar.gz"
          test -f "release-assets/Maju-${VERSION}-android.apk"
          (
            cd release-assets
            sha256sum \
              "Maju-${VERSION}-windows-x86_64-setup.exe" \
              "maju-relay-${VERSION}-linux-x86_64.tar.gz" \
              "Maju-${VERSION}-android.apk" > SHA256SUMS
          )

      - name: Publish versioned assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" release-assets/* --clobber
          else
            gh release create "v${VERSION}" release-assets/* \
              --target "${{ needs.validate.outputs.source_sha }}" \
              --title "Maju v${VERSION}" \
              --latest \
              --generate-notes
          fi

      - name: Generate Windows updater manifest
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const file = `Maju-${version}-windows-x86_64-setup.exe`;
          const signature = fs.readFileSync(`release-assets/${file}.sig`, 'utf8').trim();
          const manifest = {
            version,
            notes: `Maju ${version}`,
            pub_date: new Date().toISOString(),
            platforms: {
              'windows-x86_64': {
                signature,
                url: `https://github.com/heap-cider/maju/releases/download/v${version}/${file}`,
              },
            },
          };
          fs.writeFileSync('latest.json', `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Publish rolling updater manifest
        shell: bash
        run: |
          set -euo pipefail
          gh release view maju-desktop-latest >/dev/null 2>&1 || \
            gh release create maju-desktop-latest \
              --prerelease \
              --title "Maju Desktop Auto-Update" \
              --notes "Rolling Tauri updater metadata."
          gh release upload maju-desktop-latest latest.json --clobber
          gh release upload "v${VERSION}" latest.json --clobber
