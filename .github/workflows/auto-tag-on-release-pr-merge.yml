name: Auto-tag on Release PR Merge

# Three PR-driven release lanes share this workflow. Each uses an explicit branch
# prefix; the main chart lane also auto-detects a Chart.yaml version bump so
# a chart feature PR can publish its own new version when merged:
#
#   version-bump/<v>   → tag v<v>        → release.yml + docker.yml
#   chart-release/<v>  → tag chart-v<v>  → helm-chart.yml (main helm chart)
#   push-chart-release/<v> → tag push-chart-v<v> → push-gateway-helm-chart.yml
#   any internal PR that bumps deploy/charts/maju/Chart.yaml `version`
#                       → tag chart-v<v>  → helm-chart.yml (helm chart)
#
# Mobile candidate tags do not come from merged PRs. Operators create immutable
# mobile-v<v>-rc.N tags directly from remote main with scripts/mobile-release.sh,
# then hand the exact tag to maju-releases.
#
# Release tags are created with GITHUB_TOKEN, then the matching publishers are
# dispatched explicitly at that immutable tag. GitHub intentionally suppresses
# push workflows for refs created by GITHUB_TOKEN; workflow_dispatch is the
# supported exception and avoids a separately managed GitHub App or PAT.
#
# Mobile is manual-only by infosec necessity: OSS `heap-cider/maju` CI must
# not trigger CI in the private `maju-releases` repo. A human feeds the exact
# mobile candidate tag to the private Buildkite pipeline, which builds and
# ships mobile.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  actions: write
  contents: write

jobs:
  auto-tag:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release lane and version
        id: release
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          # Explicit release branches retain their established behavior. For an
          # ordinary internal PR, publish only when Chart.yaml itself changed
          # and its version differs from the PR's base commit.
          case "$BRANCH" in
            version-bump/*)
              VERSION="${BRANCH#version-bump/}"
              TAG_PREFIX="v"
              PUBLISHERS="release.yml docker.yml" ;;
            chart-release/*)
              VERSION="${BRANCH#chart-release/}"
              TAG_PREFIX="chart-v"
              PUBLISHERS="helm-chart.yml" ;;
            push-chart-release/*)
              VERSION="${BRANCH#push-chart-release/}"
              TAG_PREFIX="push-chart-v"
              PUBLISHERS="push-gateway-helm-chart.yml" ;;
            *)
              parent_sha="$(git rev-parse HEAD^)"
              old_version="$(git show "${parent_sha}:deploy/charts/maju/Chart.yaml" 2>/dev/null | awk '/^version:/ {print $2}')"
              VERSION="$(awk '/^version:/ {print $2}' deploy/charts/maju/Chart.yaml)"
              if [ -z "$old_version" ] || [ -z "$VERSION" ] || [ "$old_version" = "$VERSION" ]; then
                echo "No release branch or chart version bump — nothing to tag"
                echo "enabled=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              TAG_PREFIX="chart-v"
              PUBLISHERS="helm-chart.yml" ;;
          esac
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Invalid release version: '$VERSION'"
            exit 1
          fi
          {
            echo "enabled=true"
            echo "tag=${TAG_PREFIX}${VERSION}"
            echo "version=${VERSION}"
            echo "publishers=${PUBLISHERS}"
          } >> "$GITHUB_OUTPUT"
          echo "Tagging ${TAG_PREFIX}${VERSION}"

      - name: Create and push tag
        if: steps.release.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Check gh's exit status, not its output. A missing ref returns a 404
          # JSON body on stdout, which must not be mistaken for an existing tag.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            EXISTING_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
            if [ "$EXISTING_SHA" = "$GITHUB_SHA" ]; then
              echo "Tag $TAG already exists at $GITHUB_SHA — skipping tag creation"
              exit 0
            else
              echo "::error::Tag $TAG already exists at $EXISTING_SHA (expected $GITHUB_SHA)"
              exit 1
            fi
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" \
            -f sha="$GITHUB_SHA" \
            --silent

      - name: Dispatch publishers at the release tag
        if: steps.release.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHERS: ${{ steps.release.outputs.publishers }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          for WORKFLOW in $PUBLISHERS; do
            case "$WORKFLOW" in
              release.yml)
                gh workflow run "$WORKFLOW" --ref "$TAG" ;;
              docker.yml)
                gh workflow run "$WORKFLOW" --ref "$TAG" -f version="$VERSION" ;;
              helm-chart.yml|push-gateway-helm-chart.yml)
                gh workflow run "$WORKFLOW" --ref "$TAG" \
                  -f version="$VERSION" -f ref="$TAG" ;;
              *)
                echo "::error::Unknown release publisher: $WORKFLOW"
                exit 1 ;;
            esac
          done
