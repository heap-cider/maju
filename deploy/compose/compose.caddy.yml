services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      MAJU_DOMAIN: ${MAJU_DOMAIN:?set MAJU_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - maju-caddy-data:/data
      - maju-caddy-config:/config
    restart: unless-stopped
    networks:
      - maju-net

volumes:
  maju-caddy-data:
    labels:
      com.maju.volume: caddy-data
  maju-caddy-config:
    labels:
      com.maju.volume: caddy-config
