# Sample Secret matching `secrets.existingSecret: maju-secrets`.
#
# Manage this via SealedSecrets / SOPS / External Secrets / Vault — anything
# that keeps the unencrypted form out of git. The chart reads keys it finds
# and leaves the rest as Pod env vars marked `optional: true`.
#
# Keys consumed by the relay (all optional unless required by relay config):
#   MAJU_RELAY_PRIVATE_KEY        — 64-char hex; relay identity (do NOT rotate)
#   MAJU_GIT_HOOK_HMAC_SECRET     — 32+ chars; required when replicaCount > 1
#   DATABASE_URL                  — postgres://...
#   READ_DATABASE_URL             — postgres://... (optional read-replica; omit to disable read routing)
#   REDIS_URL                     — redis://...  (required when replicaCount > 1)
#   MAJU_S3_ACCESS_KEY
#   MAJU_S3_SECRET_KEY
#   MAJU_KLIPY_API_KEY            — omit to disable relay-proxied GIF search
apiVersion: v1
kind: Secret
metadata:
  name: maju-secrets
  namespace: maju
type: Opaque
stringData:
  MAJU_RELAY_PRIVATE_KEY: "REPLACE_WITH_64_HEX"
  MAJU_GIT_HOOK_HMAC_SECRET: "REPLACE_WITH_RANDOM_64_CHARS"
  DATABASE_URL: "postgres://maju:REPLACE@postgres.maju.svc.cluster.local:5432/maju?sslmode=require"
  REDIS_URL: "redis://:REPLACE@redis.maju.svc.cluster.local:6379"
  MAJU_S3_ACCESS_KEY: "REPLACE"
  MAJU_S3_SECRET_KEY: "REPLACE"
  MAJU_KLIPY_API_KEY: "REPLACE"
